<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#03101d">
    <title>AERO-AI | Registration Complete</title>
    <style>
        *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 30% 35%,#0a3456,#041727 48%,#020b15 85%);color:#f4f8ff;font-family:system-ui,"Segoe UI",sans-serif}.success{width:min(540px,100%);padding:42px 35px;text-align:center;border:1px solid #2871a4;border-radius:20px;background:#061a2bf2;box-shadow:0 20px 70px #0008,0 0 35px #087eb51b}.icon{width:64px;height:64px;margin:auto auto 20px;display:grid;place-items:center;border:1px solid #16d7e8;border-radius:50%;color:#19d9ef;font-size:30px;box-shadow:0 0 24px #16d7e833}h1{margin:0 0 12px;font-size:30px}.success p{color:#a9c2dd;line-height:1.65}.button{display:inline-block;margin-top:15px;padding:13px 25px;border-radius:10px;background:linear-gradient(100deg,#14d5e7,#13bdec);color:#03202b;text-decoration:none;font-weight:700}.button.secondary{margin-left:8px;border:1px solid #28628d;background:#0a2940;color:#c6d9ef}.fine{font-size:12px;color:#809fbd!important}
    </style>
<link rel="stylesheet" href="/css/theme.css">
<script>(function(){try{var t=localStorage.getItem("aero-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}})();</script>
</head>
<body class="register-success"><button class="theme-toggle auth-theme-toggle" id="theme-toggle" type="button">Light mode</button><main class="success"><div class="icon" aria-hidden="true">✓</div><h1>Account created</h1><p th:text="${registrationSuccess} ?: 'Your AERO-AI demonstration account is ready.'">Your AERO-AI demonstration account is ready.</p><a class="button" th:href="@{/login}">Continue to Sign In</a><a class="button secondary" th:href="@{/dashboard}">Open Dashboard</a><p class="fine">Registration stores a BCrypt password hash in the local demo database. Login authentication is not configured in this college demonstration.</p></main><script src="/js/app-shell.js"></script></body>
</html>
